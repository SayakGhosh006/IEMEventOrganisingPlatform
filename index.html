function persistState(){try{localStorage.setItem('campusone-demo-v1',JSON.stringify({events,groups,notices,notifications,marks,results,role,notifSeen}))}catch(e){console.warn('CampusOne could not save browser data',e)}}
function restoreState(){try{let x=JSON.parse(localStorage.getItem('campusone-demo-v1')||'null');if(!x)return;if(Array.isArray(x.events))events=x.events;if(Array.isArray(x.groups))groups=x.groups;if(Array.isArray(x.notices))notices=x.notices;if(Array.isArray(x.notifications))notifications=x.notifications;if(Array.isArray(x.marks))marks=x.marks;if(Array.isArray(x.results))results=x.results;if(['Student','Organizer','Teacher','Admin'].includes(x.role))role=x.role;if(Number.isFinite(x.notifSeen))notifSeen=x.notifSeen;events.forEach(e=>{e.coadmin??=[];e.announcements??=[];e.chat??=[];e.participants??=[]});groups.forEach(g=>{g.announcements??=[];g.chat??=[]})}catch(e){console.warn('CampusOne saved data could not be loaded',e)}}
function render(){document.getElementById('crumb').textContent=page;document.getElementById('nav').innerHTML=navItems().map(n=>`<button class="${page===n?'active':''}" onclick="navigate('${n}')"><span class="ico">${icons[n]}</span>${n}${n==='Notifications'?'<span class="badge">'+Math.max(0,notifications.length-notifSeen)+'</span>':''}</button>`).join('');document.getElementById('content').innerHTML=page==='Home'?homePage():page==='Events'?eventsPage():page==='Groups'?groupsPage():page==='Academics'?academicsPage():page==='Notifications'?notificationsPage():profilePage();document.getElementById('userName').textContent=role==='Teacher'?'Prof. Meera Iyer':role==='Organizer'?'Riya Kapoor':role==='Admin'?'Campus Admin':'Aarav Sharma';document.getElementById('userRole').textContent=role==='Teacher'?'Teacher · Computer Science':role==='Organizer'?'Organizer · Tech Society':role==='Admin'?'Administrator':'Student · CSE, Year 3';document.getElementById('userAvatar').textContent=role==='Teacher'?'👩🏽‍🏫':role==='Organizer'?'👩🏻‍💻':role==='Admin'?'🏫':'👨🏻‍🎓';document.getElementById('roleSelect').value=role;persistState()}
function head(title,sub,action=''){return `<div class="page-head"><div><div class="eyebrow">CampusOne · ${role}</div><h1 class="page-title">${title}</h1><div class="subtitle">${sub}</div></div>${action}</div>`}
function eventRow(e){let d=dateParts(e.date);return `<div class="event"><div class="datebox"><b>${d.day}</b><span>${d.mon}</span></div><div class="event-info"><b>${esc(e.name)}</b><p>${dateText(e.date)} · ${e.time} · ${esc(e.venue)}</p></div><div class="event-action"><span class="tag ${e.status==='Ongoing'?'orange':''}">${e.status}</span><button class="button soft small" onclick="openEvent('${e.id}')">View</button></div></div>`}
function noticeRows(arr=notices){return arr.map(n=>`<div class="notice"><span class="notice-ico">${n[0]}</span><div><b>${esc(n[1])}</b><small>${esc(n[2])}</small></div></div>`).join('')}
function groupRows(arr=myGroups()){return arr.map(g=>`<div class="group-row"><div class="group-mark">${g.emoji}</div><div><b>${esc(g.name)}</b><small>${g.members} members · ${g.announcements.length?g.announcements[0]:'Your campus community'}</small></div><span class="members">↗</span></div>`).join('')}
function homePage(){if(role==='Teacher')return teacherHome();if(role==='Admin')return `<div class="hero"><div class="hero-copy"><div class="eyebrow">CAMPUS ADMIN</div><h1>One campus. One place.</h1><p>Keep your campus connected, informed, and in sync.</p></div><div class="hero-art">✳<strong>CampusOne</strong></div></div>${head('Campus overview','A live snapshot of the community.') }<div class="grid stats"><div class="stat"><div class="stat-icon">♙</div><div><b>2,480</b><span>Students connected</span></div></div><div class="stat"><div class="stat-icon">◷</div><div><b>${events.length}</b><span>Campus events</span></div></div><div class="stat"><div class="stat-icon">◉</div><div><b>${groups.length}</b><span>Communities</span></div></div><div class="stat"><div class="stat-icon">♧</div><div><b>${notices.length}</b><span>Recent notices</span></div></div></div><div class="grid cols"><section class="card"><div class="card-head"><h2>Upcoming on campus</h2><button class="link" onclick="navigate('Events')">All events →</button></div><div class="event-list">${events.filter(e=>eventState(e)!=='Past').slice(0,4).map(eventRow).join('')}</div></section><section class="card"><div class="card-head"><h2>Latest notices</h2></div>${noticeRows()}</section></div>`;
let title=role==='Organizer'?'Good morning, Riya 👋':'Good morning, Aarav 👋';return `<section class="hero"><div class="hero-copy"><div class="eyebrow">THURSDAY, 08 OCTOBER · CAMPUS LIFE</div><h1>${title}</h1><p>All your campus life, in one place. Let’s make today count.</p></div><div class="hero-art">✳<strong>ONE CAMPUS<br>ONE COMMUNITY</strong></div></section><div class="grid stats"><div class="stat"><div class="stat-icon">◷</div><div><b>${events.filter(e=>eventState(e)==='Upcoming').length}</b><span>Upcoming events</span></div></div><div class="stat"><div class="stat-icon">◉</div><div><b>${myGroups().length}</b><span>Groups joined</span></div></div><div class="stat"><div class="stat-icon">♧</div><div><b>${notifications.length-notifSeen}</b><span>Unread notifications</span></div></div><div class="stat"><div class="stat-icon">▤</div><div><b>82%</b><span>Overall performance</span></div></div></div><div class="grid cols"><div class="col"><section class="card"><div class="card-head"><h2>Upcoming events</h2><button class="link" onclick="navigate('Events')">Explore events →</button></div><div class="event-list">${events.filter(e=>eventState(e)==='Upcoming').slice(0,3).map(eventRow).join('')}</div></section><section class="card"><div class="card-head"><h2>Latest notices</h2><span class="tag">Campus-wide</span></div>${noticeRows()}</section></div><div class="col"><section class="card"><div class="card-head"><h2>My groups</h2><button class="link" onclick="navigate('Groups')">See all →</button></div>${groupRows()}</section><section class="card"><div class="card-head"><h2>Academic update</h2><button class="link" onclick="navigate('Academics')">View results →</button></div><div class="performance"><div class="score-ring"><b>82%</b></div><div><b>Looking good, Aarav!</b><p>Latest: Data Structures · 142 / 150</p></div></div></section><section class="card" style="background:#eff5ed"><b style="font:700 12px Manrope">Your campus, connected.</b><p style="font-size:11px;line-height:1.7;color:#6d796e;margin:7px 0 0">Events, classes, clubs and conversations. One home for everything happening at college.</p></section></div></div>`}
function teacherHome(){return `<div class="hero"><div class="hero-copy"><div class="eyebrow">TEACHER WORKSPACE</div><h1>Good morning, Professor 👋</h1><p>Your classes and academic updates, all together.</p></div><div class="hero-art">✳<strong>TEACH · INSPIRE<br>CONNECT</strong></div></div><div class="grid stats"><div class="stat"><div class="stat-icon">▤</div><div><b>3</b><span>Active classes</span></div></div><div class="stat"><div class="stat-icon">♙</div><div><b>126</b><span>Students</span></div></div><div class="stat"><div class="stat-icon">✎</div><div><b>4</b><span>Marks to review</span></div></div><div class="stat"><div class="stat-icon">♧</div><div><b>${notifications.length-notifSeen}</b><span>Notifications</span></div></div></div>${head('My classes','Choose a class to review results or share an update.')}<div class="grid group-grid">${['CSE-A','CSE-B','CSE-C'].map((c,i)=>`<section class="card class-card"><div class="group-mark">${['💻','🧩','📐'][i]}</div><h3>${c}</h3><p>${42+i*2} students · Computer Science</p><button class="button soft small" onclick="academicClass='${c}';navigate('Academics')">Open gradebook</button></section>`).join('')}</div>`}
function eventState(e){let now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate()),day=new Date(e.date+'T00:00:00');if(Number.isNaN(+day))return e.status||'Upcoming';if(day<today)return 'Past';if(day>today)return 'Upcoming';return e.status==='Ongoing'?'Ongoing':'Upcoming'}
function eventsPage(){let visible=events.filter(e=>eventFilter==='All'||eventState(e)===eventFilter);let action=role==='Organizer'?'<button class="button" onclick="createEventModal()">＋ Create New Event</button>':'';return `${head('Events','Discover what’s happening across your campus.',action)}<div class="filters">${['All','Upcoming','Ongoing','Past'].map(f=>`<button class="filter ${eventFilter===f?'active':''}" onclick="eventFilter='${f}';render()">${f}</button>`).join('')}</div><div class="grid events-grid">${visible.length?visible.map(eventCard).join(''):'<div class="empty">No events in this category yet.</div>'}</div>`}
function eventCard(e){let status=eventState(e);return `<article class="card event-card"><div class="event-cover"><span>${e.emoji}</span><span class="tag ${status==='Ongoing'?'orange':status==='Past'?'blue':''}">${status}</span></div><div class="event-body"><h3>${esc(e.name)}</h3><p>${esc(e.desc)}</p><div class="meta"><span>◷ ${dateText(e.date)} · ${e.time}</span><span>⌖ ${esc(e.venue)}</span><span>♙ ${e.members} / ${e.max} going</span></div><div class="event-footer"><span>By ${esc(e.organizer)}</span><div class="toolbar"><button class="button line small" onclick="openEvent('${e.id}')">Details</button>${status!=='Past'?`<button class="button ${e.joined?'soft':''} small" onclick="joinEvent('${e.id}')">${e.joined?'✓ Joined':'Join event'}</button>`:''}</div></div></div></article>`}
function groupsPage(){let visible=groups.filter(g=>groupFilter==='All'||(groupFilter==='Joined'?g.joined:!g.joined));return `${head('Groups & communities','Find your people, share ideas, and build something together.',`<button class="button" onclick="createGroupModal()">＋ Create a group</button>`)}<div class="filters">${['All','Joined','Discover'].map(f=>`<button class="filter ${groupFilter===f?'active':''}" onclick="groupFilter='${f}';render()">${f}</button>`).join('')}</div><div class="grid group-grid">${visible.map(g=>`<article class="card community-card"><div class="group-mark">${g.emoji}</div><h3>${esc(g.name)}</h3><p>${esc(g.desc)}</p><div class="community-foot"><span>♙ ${g.members} members</span><button class="button ${g.joined?'line':'soft'} small" onclick="toggleGroup('${g.id}')">${g.joined?'Open group':'Join group'}</button></div></article>`).join('')}</div>`}
function academicsPage(){if(role==='Teacher')return teacherAcademics();let rows=results.map((r,i)=>{let total=Number(r[1])+Number(r[2])+Number(r[3]);let grade=total>=135?'A':total>=120?'B+':'B';return `<tr><td>${r[0]}</td><td>${r[1]} / 20</td><td>${r[2]} / 50</td><td>${r[3]} / 100</td><td class="score">${total} / 170</td><td><span class="tag">${grade}</span></td></tr>`}).join('');return `${head('Academics','Your progress, clearly laid out.')}<div class="grid academics-layout"><section class="card"><div class="card-head"><h2>Semester 5 · Results</h2><span class="tag">Demo data</span></div><div class="table-wrap"><table><thead><tr><th>Subject</th><th>Internal</th><th>Midterm</th><th>Final</th><th>Total</th><th>Grade</th></tr></thead><tbody>${rows}</tbody></table></div></section><div class="col"><section class="card"><div class="card-head"><h2>Overall performance</h2></div><div class="performance"><div class="score-ring"><b>${Math.round(results.reduce((a,r)=>a+(+r[1]+ +r[2]+ +r[3])/170,0)/results.length*100)}%</b></div><div><b>Strong semester so far</b><p>Across 4 subjects · Semester 5</p></div></div></section><section class="card"><div class="card-head"><h2>Recently updated</h2></div><div class="notice"><span class="notice-ico">▤</span><div><b>${results[0][0]} · Midterm</b><small>Posted by Prof. Meera · Today</small></div></div><p style="color:var(--muted);font-size:10px;line-height:1.6">This is sample academic information for demonstration. Your official records live with your college.</p></section></div></div>`}
function teacherAcademics(){let rows=marks.map((r,i)=>`<tr><td>${esc(r[0])}</td>${[1,2,3].map((k)=>`<td><input aria-label="${r[0]} ${['','assignment','midterm','final'][k]} marks" type="number" min="0" max="100" value="${r[k]}" onchange="updateMark(${i},${k},this.value)"></td>`).join('')}<td class="score">${r[1]+r[2]+r[3]}</td></tr>`).join('');return `${head('Academics','Manage demo marks and share results with your students.')}<div class="filters">${['CSE-A','CSE-B','CSE-C'].map(c=>`<button class="filter ${academicClass===c?'active':''}" onclick="academicClass='${c}';render()">${c}</button>`).join('')}</div><section class="card"><div class="card-head"><div><h2>${academicClass} · Gradebook</h2><span class="subtitle">Sample marks · changes appear in the student view</span></div><button class="button small" onclick="saveMarks()">Save marks</button></div><div class="table-wrap"><table><thead><tr><th>Student</th><th>Assignment / 20</th><th>Midterm / 50</th><th>Final / 100</th><th>Total</th></tr></thead><tbody>${rows}</tbody></table></div></section><section class="card" style="margin-top:17px"><div class="card-head"><h2>Class announcements</h2><button class="button soft small" onclick="announceClass()">＋ Post an update</button></div><p style="color:var(--muted);font-size:11px">Next lecture: Data Structures, Friday at 10:00 AM · Room 204.</p></section>`}
function notificationsPage(){notifSeen=notifications.length;return `${head('Notifications','One feed for all the little things happening on campus.')}<section class="card">${notifications.map(n=>`<div class="notification"><span class="notice-ico">${n[0]}</span><div><b>${esc(n[1])}</b><p>${esc(n[2])}</p><small>${n[3]}</small></div></div>`).join('')}</section>`}
function profilePage(){return `${head('Your profile','A little introduction to you.')}<section class="card"><div style="display:flex;align-items:center;gap:14px;padding-bottom:19px;border-bottom:1px solid var(--line)"><div class="avatar" style="width:55px;height:55px;font-size:23px">${role==='Student'?'👨🏻‍🎓':role==='Teacher'?'👩🏽‍🏫':role==='Organizer'?'👩🏻‍💻':'🏫'}</div><div><h2 style="font:800 17px Manrope;margin:0 0 4px">${role==='Student'?'Aarav Sharma':role==='Teacher'?'Prof. Meera Iyer':role==='Organizer'?'Riya Kapoor':'Campus Admin'}</h2><span class="subtitle">${role==='Student'?'Student · CSE, Year 3':role==='Teacher'?'Teacher · Computer Science':role==='Organizer'?'Event Organizer · Tech Society':'Administrator'}</span></div></div><div class="grid profile-grid">${[['Email','aarav.sharma@campus.edu'],['Department','Computer Science'],['Year','3rd year'],['Campus','North Campus'],['Member since','August 2024'],['Groups joined',myGroups().length]].map(x=>`<div class="profile-item"><small>${x[0]}</small><b>${x[1]}</b></div>`).join('')}</div><div style="margin-top:18px"><button class="button soft" onclick="showToast('Profile editing is coming soon')">Edit profile</button></div></section>`}
function navigate(to){page=to;if(to==='Notifications')notifSeen=notifications.length;render();window.scrollTo(0,0)}
function switchRole(v){role=v;page='Home';render();showToast(`Switched to ${v} demo`)}document.getElementById('roleSelect').addEventListener('change',e=>switchRole(e.target.value));
function showToast(msg){let root=document.getElementById('toastRoot');root.innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>root.innerHTML='',2600)}
function modal(title,body,onSubmit,label='Save'){document.getElementById('modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h2>${title}</h2><button class="close" onclick="closeModal()">×</button></div>${body}<div class="modal-actions"><button class="button line" onclick="closeModal()">Cancel</button><button class="button" onclick="${onSubmit}">${label}</button></div></div></div>`}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function createEventModal(){modal('Create a new event',`<div class="field"><label>Event name</label><input class="input" id="fName" placeholder="e.g. AI Innovation Workshop"></div><div class="field"><label>Description</label><textarea class="input" id="fDesc" placeholder="What should students know?"></textarea></div><div class="form-grid"><div class="field"><label>Date</label><input class="input" id="fDate" type="date" value="2026-10-24"></div><div class="field"><label>Time</label><input class="input" id="fTime" type="time" value="10:00"></div><div class="field"><label>Venue</label><input class="input" id="fVenue" placeholder="e.g. Innovation Hub"></div><div class="field"><label>Registration deadline</label><input class="input" id="fDeadline" type="date" value="2026-10-22"></div><div class="field"><label>Maximum participants</label><input class="input" id="fMax" type="number" min="1" value="80"></div></div><div class="subtitle">An event group is created automatically, and you’ll be its Event Admin.</div>`,'submitEvent()','Create event')}
function submitEvent(){let name=document.getElementById('fName').value.trim();if(!name){showToast('Add an event name to continue');return}let d=document.getElementById('fDate').value||'2026-10-24',deadline=document.getElementById('fDeadline').value||d;if(deadline>d){showToast('Registration deadline must be on or before event day');return}let t=document.getElementById('fTime').value||'10:00',dateObj=new Date(`2000-01-01T${t}`);let id='e'+Date.now();let e={id,name,desc:document.getElementById('fDesc').value.trim()||'A new event for the CampusOne community.',date:d,time:dateObj.toLocaleTimeString('en',{hour:'numeric',minute:'2-digit'}),venue:document.getElementById('fVenue').value.trim()||'Campus',organizer:role==='Organizer'?'Riya Kapoor':'CampusOne Member',members:1,max:+document.getElementById('fMax').value||80,deadline,status:'Upcoming',emoji:'💡',joined:true,admin:true,coadmin:[],participants:[{name:role==='Organizer'?'Riya Kapoor':'Aarav Sharma',date:'Today'}],announcements:[],chat:[]};events.unshift(e);selectedEvent=id;notifications.unshift(['✳','You created an event',`${name} is ready. You’re the Event Admin.`,'Just now']);closeModal();page='Events';render();showToast('Event created — you’re the Event Admin')}
function localDateKey(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function joinEvent(id){let e=events.find(x=>x.id===id);if(!e)return;if(e.joined){selectedEvent=id;openEvent(id);return}if(eventState(e)==='Past'){showToast('Registration for this event has closed');return}if(e.deadline<localDateKey()){showToast('Registration deadline has passed');return}if(e.members>=e.max){showToast('This event has reached its participant limit');return}e.joined=true;e.members++;e.participants??=[];e.participants.push({name:role==='Student'?'Aarav Sharma':role==='Organizer'?'Riya Kapoor':'CampusOne Member',date:'Today'});notifications.unshift(['✳','You joined '+e.name,'The event group is ready for you.','Just now']);selectedEvent=id;render();showToast(`You joined ${e.name} — event group created`)}
function openEvent(id){selectedEvent=id;let e=events.find(x=>x.id===id);if(!e)return;e.participants??=[];let canAdmin=e.admin||role==='Organizer'&&e.organizer==='Riya Kapoor';let info=`<div class="event-cover" style="height:120px;border-radius:11px;margin-bottom:15px;font-size:35px">${e.emoji}<span class="tag">${eventState(e)}</span></div><h3 style="font:800 18px Manrope;margin:0 0 6px">${esc(e.name)}</h3><p class="subtitle" style="line-height:1.7">${esc(e.desc)}</p><div class="meta" style="margin:14px 0"><span>◷ ${dateText(e.date)} · ${e.time}</span><span>⌖ ${esc(e.venue)}</span><span>♙ ${e.members} / ${e.max}</span></div><p style="font-size:11px;color:var(--muted)">Organized by <b style="color:var(--ink)">${esc(e.organizer)}</b> · Registration closes ${dateText(e.deadline)}</p>`;let body=`${info}<div class="tabs"><button class="${groupTab==='Announcements'?'active':''}" onclick="groupTab='Announcements';openEvent('${id}')">Announcements</button><button class="${groupTab==='Chat'?'active':''}" onclick="groupTab='Chat';openEvent('${id}')">Chat</button><button class="${groupTab==='Participants'?'active':''}" onclick="groupTab='Participants';openEvent('${id}')">Participants</button><button class="${groupTab==='Event Info'?'active':''}" onclick="groupTab='Event Info';openEvent('${id}')">Event info</button></div>${groupTab==='Announcements'?`<div>${(e.announcements.length?e.announcements:['No announcements yet. The organizers will post updates here.']).map(a=>`<div class="notice"><span class="notice-ico">📣</span><div><b>${esc(a)}</b><small>Event organizer · Recent</small></div></div>`).join('')}</div>`:groupTab==='Chat'?`<div class="chat">${(e.chat.length?e.chat:[['CampusOne','Your event group is ready. Say hello!']]).map(m=>`<div class="bubble ${m[0].startsWith('You')?'mine':''}"><b>${esc(m[0])}</b>${esc(m[1])}<small>now</small></div>`).join('')}</div><div class="chat-compose"><input class="input" id="chatInput" placeholder="Write a message…" onkeydown="if(event.key==='Enter')sendEventChat('${id}')"><button class="button small" onclick="sendEventChat('${id}')">Send</button></div>`:groupTab==='Participants'?`<div class="participant"><div class="avatar">👩🏻‍💻</div><div><b>${esc(e.organizer)}</b><small>Event Organizer</small></div><span class="tag">Admin</span></div>${e.coadmin.map(c=>`<div class="participant"><div class="avatar">🧑🏻</div><div><b>${esc(c)}</b><small>Event team</small></div><span class="tag blue">Co-Admin</span></div>`).join('')}${e.participants.map(p=>`<div class="participant"><div class="avatar">👨🏻‍🎓</div><div><b>${esc(p.name)}</b><small>Registered · ${esc(p.date)}</small></div><span class="tag">Member</span></div>`).join('')}`:`<p class="subtitle" style="line-height:1.8">${esc(e.desc)}<br>Registration deadline: ${dateText(e.deadline)}<br>Capacity: ${e.max} participants</p>`}`;if(canAdmin)body+=`<div style="background:#f3f7f2;border:1px solid #e6eee4;border-radius:10px;padding:13px;margin-top:17px"><div style="display:flex;justify-content:space-between;align-items:center"><b style="font:700 12px Manrope;color:var(--green)">⚙ Event Admin Panel</b><span class="tag">${e.coadmin.length+1} admin${e.coadmin.length?'s':''}</span></div><div class="toolbar" style="margin-top:11px;flex-wrap:wrap"><button class="button soft small" onclick="editEvent('${id}')">Edit Event</button><button class="button soft small" onclick="postAnnouncement('${id}')">Post Announcement</button><button class="button line small" onclick="manageParticipants('${id}')">Manage Participants</button><button class="button line small" onclick="promoteModal('${id}')">＋ Add Co-Admin</button>${e.coadmin.length?`<button class="button line small" onclick="removeCoAdmin('${id}')">Remove Team Admin</button>`:''}<button class="button line small" onclick="groupTab='Participants';openEvent('${id}')">View Registrations</button></div></div>`;let footer=e.joined?'':`<div class="modal-actions"><button class="button" onclick="closeModal();joinEvent('${id}')">Join event</button></div>`;document.getElementById('modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><div><span class="eyebrow">EVENT GROUP · ${e.members} MEMBERS</span></div><button class="close" onclick="closeModal()">×</button></div>${body}${footer}</div></div>`;persistState()}
function postAnnouncement(id){let e=events.find(x=>x.id===id);modal('Post an announcement',`<div class="field"><label>Announcement</label><textarea class="input" id="announcementText" placeholder="Share an update with event members…"></textarea></div>` ,`submitAnnouncement('${id}')`,'Post update')}
function submitAnnouncement(id){let v=document.getElementById('announcementText').value.trim();if(!v){showToast('Write an update first');return}let e=events.find(x=>x.id===id);e.announcements.unshift(v);notifications.unshift(['📣','New event announcement',`${e.name} · ${v}`,'Just now']);groupTab='Announcements';openEvent(id);showToast('Announcement posted to the event group')}
function promoteModal(id){let e=events.find(x=>x.id===id),names=[...new Set([...(e.participants||[]).map(p=>p.name),'Priya Menon','Kabir Sethi','Maya Rao'])].filter(n=>!e.coadmin.includes(n)&&n!==(role==='Organizer'?'Riya Kapoor':'Aarav Sharma'));modal('Add a Co-Admin',`<p class="subtitle" style="line-height:1.6">Promote a registered participant to help manage ${esc(e.name)}.</p><div class="field"><label>Participant</label><select class="input" id="coadminName">${names.map(n=>`<option>${esc(n)}</option>`).join('')}</select></div>` ,`submitPromote('${id}')`,'Promote')}
function submitPromote(id){let e=events.find(x=>x.id===id),name=document.getElementById('coadminName').value;if(!e.coadmin.includes(name)){e.coadmin.push(name);notifications.unshift(['✳','Co-Admin added',`${name} can now help manage ${e.name}.`,'Just now'])}openEvent(id);showToast(`${name} is now a Co-Admin`)}
function removeCoAdmin(id){let e=events.find(x=>x.id===id);if(!e.coadmin.length){showToast('There are no Co-Admins to remove');return}modal('Remove a Co-Admin',`<div class="field"><label>Team admin</label><select class="input" id="removeCoadminName">${e.coadmin.map(n=>`<option>${esc(n)}</option>`).join('')}</select></div>` ,`submitRemoveCoAdmin('${id}')`,'Remove admin')}
function submitRemoveCoAdmin(id){let e=events.find(x=>x.id===id),name=document.getElementById('removeCoadminName').value;e.coadmin=e.coadmin.filter(n=>n!==name);openEvent(id);showToast(`${name} removed from the event team`)}
function editEvent(id){let e=events.find(x=>x.id===id);modal('Edit event',`<div class="field"><label>Event name</label><input class="input" id="editName" value="${esc(e.name)}"></div><div class="field"><label>Description</label><textarea class="input" id="editDesc">${esc(e.desc)}</textarea></div><div class="field"><label>Venue</label><input class="input" id="editVenue" value="${esc(e.venue)}"></div>` ,`submitEdit('${id}')`,'Save changes')}
function submitEdit(id){let e=events.find(x=>x.id===id);e.name=document.getElementById('editName').value||e.name;e.desc=document.getElementById('editDesc').value;e.venue=document.getElementById('editVenue').value||e.venue;openEvent(id);showToast('Event details updated')}
function manageParticipants(id){let e=events.find(x=>x.id===id);let people=e.participants||[];modal('Manage participants',`${people.length?people.map((p,i)=>`<div class="participant"><div class="avatar">👨🏻‍🎓</div><div><b>${esc(p.name)}</b><small>Registered · ${esc(p.date)}</small></div><button class="button line small" onclick="removeParticipant('${id}',${i})">Remove</button></div>`).join(''):'<p class="subtitle">No individual registrations recorded yet.</p>'}<p class="subtitle" style="margin-top:13px">${e.members} registrations · ${e.max} capacity</p>`,'closeModal()','Done')}
function removeParticipant(id,i){let e=events.find(x=>x.id===id);if(!e.participants||!e.participants[i])return;e.participants.splice(i,1);e.members=Math.max(0,e.members-1);manageParticipants(id);persistState()}
function sendEventChat(id){let input=document.getElementById('chatInput');if(!input||!input.value.trim())return;let e=events.find(x=>x.id===id);e.chat.push(['You · Participant',input.value.trim()]);notifications.unshift(['💬','New message in '+e.name,input.value.trim(),'Just now']);groupTab='Chat';openEvent(id)}
function toggleGroup(id){let g=groups.find(x=>x.id===id);if(g.joined){openGroup(id);return}g.joined=true;g.members++;notifications.unshift(['✳','You joined '+g.name,'Welcome to your new community.','Just now']);render();showToast(`Welcome to ${g.name}`)}
function openGroup(id){let g=groups.find(x=>x.id===id);groupScope='group';let body=`<div style="display:flex;gap:12px;align-items:center;margin-bottom:15px"><div class="group-mark" style="width:48px;height:48px">${g.emoji}</div><div><h3 style="font:800 17px Manrope;margin:0 0 3px">${esc(g.name)}</h3><span class="subtitle">${g.members} members · ${esc(g.desc)}</span></div></div><div class="tabs"><button class="${groupTab==='Announcements'?'active':''}" onclick="groupTab='Announcements';openGroup('${id}')">Announcements</button><button class="${groupTab==='Chat'?'active':''}" onclick="groupTab='Chat';openGroup('${id}')">Chat</button><button class="${groupTab==='Participants'?'active':''}" onclick="groupTab='Participants';openGroup('${id}')">Members</button><button class="${groupTab==='Event Info'?'active':''}" onclick="groupTab='Event Info';openGroup('${id}')">Events</button></div>${groupTab==='Announcements'?`${g.announcements.map(a=>`<div class="notice"><span class="notice-ico">📣</span><div><b>${esc(a)}</b><small>Group announcement · Recent</small></div></div>`).join('')||'<p class="subtitle">No announcements yet. Your community starts here.</p>'}${g.joined?`<button class="button soft small" style="margin-top:12px" onclick="groupAnnouncementModal('${id}')">＋ Post announcement</button>`:''}`:groupTab==='Chat'?`<div class="chat">${g.chat.map(m=>`<div class="bubble ${m[0]==='You'?'mine':''}"><b>${esc(m[0])}</b>${esc(m[1])}<small>now</small></div>`).join('')}</div><div class="chat-compose"><input class="input" id="groupChatInput" placeholder="Write a message…" onkeydown="if(event.key==='Enter')sendGroupChat('${id}')"><button class="button small" onclick="sendGroupChat('${id}')">Send</button></div>`:groupTab==='Participants'?`<div class="participant"><div class="avatar">👨🏻‍🎓</div><div><b>Aarav Sharma</b><small>Member</small></div><span class="tag">You</span></div><div class="participant"><div class="avatar">👩🏻</div><div><b>Maya Rao</b><small>Member</small></div></div>`:`<p class="subtitle">${g.name==='Hackathon Team'?'Hackathon 2026 · 12 October · Main Auditorium':'No upcoming group events. Browse campus events to find something for your community.'}</p>${g.name==='Hackathon Team'?`<button class="button soft small" onclick="closeModal();groupTab='Announcements';openEvent('e1')">Open Hackathon event group</button>`:''}`}${g.joined?`<div style="display:flex;justify-content:flex-end;border-top:1px solid var(--line);padding-top:12px;margin-top:14px"><button class="button line small" onclick="leaveGroup('${id}')">Leave group</button></div>`:''}`;document.getElementById('modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><span class="eyebrow">COMMUNITY GROUP</span><button class="close" onclick="closeModal()">×</button></div>${body}</div></div>`;persistState()}
function sendGroupChat(id){let input=document.getElementById('groupChatInput');if(!input||!input.value.trim())return;let g=groups.find(x=>x.id===id);g.chat.push(['You',input.value.trim()]);notifications.unshift(['💬','New message in '+g.name,input.value.trim(),'Just now']);groupTab='Chat';openGroup(id)}
function leaveGroup(id){let g=groups.find(x=>x.id===id);g.joined=false;g.members--;closeModal();render();showToast(`You left ${g.name}`)}
function groupAnnouncementModal(id){modal('Post a group announcement',`<div class="field"><label>Announcement</label><textarea class="input" id="groupAnnouncement" placeholder="Share an update with your group…"></textarea></div>`,`submitGroupAnnouncement('${id}')`,'Post update')}
function submitGroupAnnouncement(id){let text=document.getElementById('groupAnnouncement').value.trim();if(!text){showToast('Write an update first');return}let g=groups.find(x=>x.id===id);g.announcements.unshift(text);notifications.unshift(['📣','New announcement in '+g.name,text,'Just now']);groupTab='Announcements';openGroup(id);showToast('Group announcement posted')}
function createGroupModal(){modal('Create a community group',`<div class="field"><label>Group name</label><input class="input" id="gName" placeholder="e.g. Football Community"></div><div class="field"><label>Description</label><textarea class="input" id="gDesc" placeholder="What brings your group together?"></textarea></div><div class="field"><label>Community type</label><select class="input" id="gEmoji"><option value="🧠">Interest group</option><option value="⚽">Sports</option><option value="🎨">Arts & culture</option><option value="📚">Academic</option></select></div>`,'submitGroup()','Create group')}
function submitGroup(){let name=document.getElementById('gName').value.trim();if(!name){showToast('Add a group name to continue');return}groups.unshift({id:'g'+Date.now(),name,desc:document.getElementById('gDesc').value.trim()||'A new CampusOne community.',members:1,emoji:document.getElementById('gEmoji').value,joined:true,announcements:[],chat:[]});closeModal();render();showToast(`Group created — welcome to ${name}`)}
function updateMark(i,k,v){marks[i][k]=Math.max(0,Math.min(k===1?20:k===2?50:100,+v||0))}function saveMarks(){let student=marks.find(r=>r[0]==='Aarav Sharma')||marks[0],subject=results.findIndex(r=>r[0]==='Data Structures');if(subject>=0)results[subject]=[results[subject][0],student[1],student[2],student[3]];notifications.unshift(['▤','Teacher posted new marks','Data Structures results are available in Academics.','Just now']);showToast('Marks saved — Data Structures results updated for the student');render()}
function announceClass(){modal('Post a class announcement',`<div class="field"><label>Announcement</label><textarea class="input" id="classAnnouncement" placeholder="Share a class update…"></textarea></div>`,'submitClassAnnouncement()','Post update')}
function submitClassAnnouncement(){let text=document.getElementById('classAnnouncement').value.trim();if(!text){showToast('Write an update first');return}notices.unshift(['📢',text,`${academicClass} · Prof. Meera · Just now`]);notifications.unshift(['📣','New class announcement',text,'Just now']);closeModal();render();showToast('Announcement shared with the class')}
function campusSearch(query){let q=query.toLowerCase(),items=[...events.filter(x=>[x.name,x.desc,x.venue,x.organizer].some(s=>s.toLowerCase().includes(q))).map(x=>`<div class="notice"><span class="notice-ico">${x.emoji}</span><div><b>${esc(x.name)}</b><small>Event · ${dateText(x.date)} · ${esc(x.venue)}</small></div><button class="button soft small" onclick="closeModal();openEvent('${x.id}')">Open</button></div>`),...groups.filter(x=>[x.name,x.desc].some(s=>s.toLowerCase().includes(q))).map(x=>`<div class="notice"><span class="notice-ico">${x.emoji}</span><div><b>${esc(x.name)}</b><small>Community · ${x.members} members</small></div><button class="button soft small" onclick="closeModal();openGroup('${x.id}')">Open</button></div>`),...notices.filter(x=>x.join(' ').toLowerCase().includes(q)).map(x=>`<div class="notice"><span class="notice-ico">${x[0]}</span><div><b>${esc(x[1])}</b><small>${esc(x[2])}</small></div></div>`),...notifications.filter(x=>x.join(' ').toLowerCase().includes(q)).map(x=>`<div class="notice"><span class="notice-ico">${x[0]}</span><div><b>${esc(x[1])}</b><small>${esc(x[2])}</small></div></div>`)];if(!items.length){showToast('No campus matches found');return}document.getElementById('modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h2>Search results</h2><button class="close" onclick="closeModal()">×</button></div><p class="subtitle">${items.length} result${items.length===1?'':'s'} for “${esc(query)}”</p>${items.join('')}</div></div>`}
document.getElementById('search').addEventListener('keydown',e=>{if(e.key==='Enter'){let q=e.target.value.trim();if(q)campusSearch(q)}});
restoreState();render();
</script></body></html>
